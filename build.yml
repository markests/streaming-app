name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Buat file proyek
        run: |
          cat > settings.gradle.kts <<'EOF_1'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
              }
          }
          rootProject.name = "LiveStream"
          include(":app")
          EOF_1
          cat > build.gradle.kts <<'EOF_2'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_2
          cat > gradle.properties <<'EOF_3'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_3
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_4'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.livestream"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.livestream"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("com.github.pedroSG94.RootEncoder:library:2.5.5")
          }
          EOF_4
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="LiveStream"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF_5
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'EOF_6'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#111111">

              <SurfaceView
                  android:id="@+id/surfaceView"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1" />

              <EditText
                  android:id="@+id/etUrl"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_margin="8dp"
                  android:hint="rtmp://a.rtmp.youtube.com/live2/STREAM_KEY"
                  android:inputType="textUri"
                  android:textColor="#FFFFFF"
                  android:textColorHint="#888888" />

              <Button
                  android:id="@+id/btnToggle"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_margin="8dp"
                  android:text="Mulai Live" />

          </LinearLayout>
          EOF_6
          mkdir -p app/src/main/java/com/example/livestream
          cat > app/src/main/java/com/example/livestream/MainActivity.kt <<'EOF_7'
          package com.example.livestream

          import android.Manifest
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import com.pedro.common.ConnectChecker
          import com.pedro.encoder.input.video.CameraHelper
          import com.pedro.library.rtmp.RtmpCamera1

          class MainActivity : AppCompatActivity(), ConnectChecker, SurfaceHolder.Callback {

              private lateinit var camera: RtmpCamera1
              private lateinit var surfaceView: SurfaceView
              private lateinit var etUrl: EditText
              private lateinit var btnToggle: Button
              private var surfaceReady = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  surfaceView = findViewById(R.id.surfaceView)
                  etUrl = findViewById(R.id.etUrl)
                  btnToggle = findViewById(R.id.btnToggle)

                  camera = RtmpCamera1(surfaceView, this)
                  surfaceView.holder.addCallback(this)

                  btnToggle.setOnClickListener { toggleStream() }

                  if (!hasPermissions()) {
                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(Manifest.permission.CAMERA, Manifest.permission.RECORD_AUDIO),
                          1
                      )
                  }
              }

              private fun hasPermissions(): Boolean {
                  return ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) ==
                      PackageManager.PERMISSION_GRANTED &&
                      ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) ==
                      PackageManager.PERMISSION_GRANTED
              }

              private fun toggleStream() {
                  if (camera.isStreaming) {
                      camera.stopStream()
                      btnToggle.text = "Mulai Live"
                      return
                  }
                  val url = etUrl.text.toString().trim()
                  if (!url.startsWith("rtmp")) {
                      toast("Isi URL RTMP + stream key dulu")
                      return
                  }
                  if (!hasPermissions()) {
                      toast("Izin kamera dan mikrofon belum diberikan")
                      return
                  }
                  val rotation = CameraHelper.getCameraOrientation(this)
                  val ready = camera.prepareAudio() &&
                      camera.prepareVideo(1280, 720, 30, 2500 * 1024, rotation)
                  if (ready) {
                      camera.startStream(url)
                      btnToggle.text = "Stop Live"
                  } else {
                      toast("Encoder gagal disiapkan")
                  }
              }

              private fun toast(msg: String) {
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (hasPermissions() && surfaceReady && !camera.isOnPreview) {
                      camera.startPreview()
                  }
              }

              override fun surfaceCreated(holder: SurfaceHolder) {}

              override fun surfaceChanged(holder: SurfaceHolder, format: Int, width: Int, height: Int) {
                  surfaceReady = true
                  if (hasPermissions() && !camera.isOnPreview) {
                      camera.startPreview()
                  }
              }

              override fun surfaceDestroyed(holder: SurfaceHolder) {
                  surfaceReady = false
                  if (camera.isStreaming) {
                      camera.stopStream()
                      btnToggle.text = "Mulai Live"
                  }
                  if (camera.isOnPreview) camera.stopPreview()
              }

              override fun onConnectionStarted(url: String) {}

              override fun onConnectionSuccess() {
                  runOnUiThread { toast("Terhubung, live berjalan") }
              }

              override fun onConnectionFailed(reason: String) {
                  runOnUiThread {
                      toast("Gagal terhubung: $reason")
                      camera.stopStream()
                      btnToggle.text = "Mulai Live"
                  }
              }

              override fun onNewBitrate(bitrate: Long) {}

              override fun onDisconnect() {
                  runOnUiThread { toast("Terputus") }
              }

              override fun onAuthError() {
                  runOnUiThread { toast("Autentikasi gagal") }
              }

              override fun onAuthSuccess() {}
          }
          EOF_7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build APK debug
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: livestream-apk
          path: app/build/outputs/apk/debug/*.apk
